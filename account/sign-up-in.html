<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access - Sign In / Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style> body { font-family: 'Google Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-md w-full bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <a href="../index.html" class="inline-flex items-center text-xs text-slate-400 hover:text-slate-200 mb-2 gap-1">
                <span class="material-icons text-sm">arrow_back</span> Back to Gateway
            </a>
            <h1 class="text-2xl font-bold text-white">Account Access</h1>
            <p class="text-xs text-slate-400">Sign in or create a new user profile</p>
        </div>

        <!-- Mode Toggle Tabs -->
        <div class="flex rounded-xl bg-slate-900/80 p-1 border border-slate-700/60">
            <button id="tabSignIn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition">Sign In</button>
            <button id="tabSignUp" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition">Sign Up</button>
        </div>

        <!-- Status Message Banner -->
        <div id="statusMsg" class="hidden text-xs p-3 rounded-lg border"></div>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="emailInput" required placeholder="user@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-sm transition">
                Sign In
            </button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-700/50">
            <span>By proceeding, you agree to portal system rules and terms.</span>
        </div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "../web-info/firebase.js";

        let isSignUpMode = false;

        const tabSignIn = document.getElementById('tabSignIn');
        const tabSignUp = document.getElementById('tabSignUp');
        const submitBtn = document.getElementById('submitBtn');
        const authForm = document.getElementById('authForm');
        const statusMsg = document.getElementById('statusMsg');

        // Check if user is already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "overview.html";
            }
        });

        tabSignIn.addEventListener('click', () => {
            isSignUpMode = false;
            tabSignIn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition";
            tabSignUp.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition";
            submitBtn.textContent = "Sign In";
            hideStatus();
        });

        tabSignUp.addEventListener('click', () => {
            isSignUpMode = true;
            tabSignUp.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition";
            tabSignIn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition";
            submitBtn.textContent = "Create Account";
            hideStatus();
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            submitBtn.disabled = true;
            submitBtn.textContent = "Processing...";

            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    showStatus("Account created successfully! Redirecting...", "success");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    showStatus("Sign in successful! Redirecting...", "success");
                }
                setTimeout(() => window.location.href = "overview.html", 1000);
            } catch (error) {
                showStatus(error.message || "Authentication failed.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUpMode ? "Create Account" : "Sign In";
            }
        });

        function showStatus(msg, type) {
            statusMsg.classList.remove('hidden');
            statusMsg.textContent = msg;
            if (type === 'success') {
                statusMsg.className = "text-xs p-3 rounded-lg border bg-emerald-950/80 text-emerald-300 border-emerald-800";
            } else {
                statusMsg.className = "text-xs p-3 rounded-lg border bg-red-950/80 text-red-300 border-red-800";
            }
        }

        function hideStatus() {
            statusMsg.classList.add('hidden');
        }
    </script>
</body>
</html>
