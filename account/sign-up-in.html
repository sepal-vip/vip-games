<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access - Sign In / Up</title>
    <link rel="icon" type="image/png" href="https://sepal-vip.github.io/vip-games/vip-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style> 
        body { font-family: 'Google Sans', sans-serif; } 
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-blue-500 selection:text-white">
    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <a href="../index.html" class="inline-flex items-center text-xs text-slate-400 hover:text-slate-200 mb-2 gap-1 transition">
                <span class="material-icons text-sm">arrow_back</span> Back to Gateway
                <span class="material-icons text-amber-500 text-base"><img src="https://sepal-vip.github.io/vip-games/vip-icon.png" alt="Vip Icon" class="w-4 h-4"></span>
            </a>
            <h1 class="text-2xl font-black text-white tracking-tight">Portal Account Access</h1>
            <p class="text-xs text-slate-400">Sign in to your account or create a new user profile</p>
        </div>

        <!-- Mode Toggle Tabs -->
        <div class="flex rounded-2xl bg-slate-950 p-1 border border-slate-800">
            <button id="tabSignIn" class="flex-1 py-2 text-xs font-bold rounded-xl bg-blue-600 text-white transition shadow">Sign In</button>
            <button id="tabSignUp" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-slate-200 transition">Sign Up</button>
        </div>

        <!-- Alert Notification -->
        <div id="statusMsg" class="hidden text-xs p-3 rounded-xl border"></div>

        <!-- Form -->
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="emailInput" required placeholder="user@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-blue-600/20">
                Sign In
            </button>
        </form>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "../web-info/firebase.js";

        // Global Debug Logger Engine
        if (localStorage.getItem('debugging') === null) {
            localStorage.setItem('debugging', '0');
        }
        function debugLog(...args) {
            if (localStorage.getItem('debugging') === '1') {
                console.log("[DEBUG:sign-up-in.html]", ...args);
            }
        }
        debugLog("Initializing Authentication Portal...");

        let isSignUpMode = false;
        const tabSignIn = document.getElementById('tabSignIn');
        const tabSignUp = document.getElementById('tabSignUp');
        const submitBtn = document.getElementById('submitBtn');
        const authForm = document.getElementById('authForm');
        const statusMsg = document.getElementById('statusMsg');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                debugLog("Already signed in; redirecting to overview:", user.uid);
                window.location.href = "overview.html";
            }
        });

        tabSignIn.addEventListener('click', () => {
            isSignUpMode = false;
            tabSignIn.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-blue-600 text-white transition shadow";
            tabSignUp.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-slate-200 transition";
            submitBtn.textContent = "Sign In";
            statusMsg.classList.add('hidden');
        });

        tabSignUp.addEventListener('click', () => {
            isSignUpMode = true;
            tabSignUp.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-blue-600 text-white transition shadow";
            tabSignIn.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-slate-200 transition";
            submitBtn.textContent = "Create Account";
            statusMsg.classList.add('hidden');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            submitBtn.disabled = true;
            submitBtn.textContent = "Authenticating...";

            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                debugLog("Auth operation succeeded for:", email);
                window.location.href = "overview.html";
            } catch (err) {
                debugLog("Auth operation error:", err);
                statusMsg.classList.remove('hidden');
                statusMsg.className = "text-xs p-3 rounded-xl border bg-red-950/80 text-red-300 border-red-800";
                statusMsg.textContent = err.message || "Authentication failed.";
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUpMode ? "Create Account" : "Sign In";
            }
        });

        // Offline Service Worker & Redirect Bootstrap
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
            });
        }
        window.addEventListener('offline', () => {
            window.location.href = '/offline.html';
        });
    </script>
</body>
</html>
