<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Overview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style> body { font-family: 'Google Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    
    <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="../index.html" class="flex items-center gap-2 text-slate-300 hover:text-white text-sm font-medium">
                <span class="material-icons text-base">arrow_back</span> Portal Gateway
            </a>
            <button id="signOutBtn" class="text-xs bg-red-950/80 hover:bg-red-900 text-red-300 px-3 py-1.5 rounded-lg border border-red-800 font-medium transition">
                Sign Out
            </button>
        </div>
    </nav>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-6">
            
            <div class="flex items-center gap-4 border-b border-slate-700/60 pb-6">
                <div class="w-16 h-16 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center text-3xl font-bold">
                    <span class="material-icons text-3xl">person</span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white" id="userEmail">Loading User Profile...</h1>
                    <p class="text-xs text-slate-400 font-mono mt-0.5">UID: <span id="userUid">...</span></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-xl p-4 space-y-1">
                    <span class="text-xs text-slate-400 font-semibold uppercase">Account Role & Verification</span>
                    <p id="userRole" class="text-sm font-bold text-slate-200">Checking authorization...</p>
                </div>

                <div class="bg-slate-900/80 border border-slate-700/50 rounded-xl p-4 space-y-1">
                    <span class="text-xs text-slate-400 font-semibold uppercase">Linked Monopoly Member Profile</span>
                    <p id="playerLink" class="text-sm font-bold text-amber-400">
                        <a href="#" id="viewPlayerProfile" class="hover:underline flex items-center gap-1">
                            <span id="linkedMemberName">View Match Record</span>
                            <span class="material-icons text-sm">open_in_new</span>
                        </a>
                    </p>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="pt-4 border-t border-slate-700/50 flex flex-wrap gap-3">
                <a href="history.html" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-xl transition">
                    View Account Activity Logs
                </a>
                <a href="../g-mono/g-mono.html" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded-xl transition">
                    Open Monopoly Suite
                </a>
            </div>

        </div>
    </main>

    <script type="module">
        import { auth, db, doc, getDoc, onAuthStateChanged, signOut } from "../web-info/firebase.js";

        const userEmail = document.getElementById('userEmail');
        const userUid = document.getElementById('userUid');
        const userRole = document.getElementById('userRole');
        const linkedMemberName = document.getElementById('linkedMemberName');
        const viewPlayerProfile = document.getElementById('viewPlayerProfile');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "sign-up-in.html";
                return;
            }

            userEmail.textContent = user.email || "Authenticated User";
            userUid.textContent = user.uid;

            // Check linked member profile in /users/{uid}
            let targetProfileName = user.email ? user.email.split('@')[0] : user.uid;

            try {
                const userDocSnap = await getDoc(doc(db, "users", user.uid));
                if (userDocSnap.exists() && userDocSnap.data().linkedMemberName) {
                    targetProfileName = userDocSnap.data().linkedMemberName;
                    linkedMemberName.textContent = `Verified Member: ${targetProfileName}`;
                } else {
                    linkedMemberName.textContent = `Member Profile (${targetProfileName})`;
                }
            } catch(e) {
                linkedMemberName.textContent = `Profile (${targetProfileName})`;
            }

            viewPlayerProfile.href = `../g-mono/view.html?player=${encodeURIComponent(targetProfileName)}`;

            // Check admin status
            try {
                const adminDoc = await getDoc(doc(db, "admin", "uuids"));
                const isMasterAdmin = user.uid === "MASTER_PERMANENT_ADMIN_UUID";
                if (isMasterAdmin || (adminDoc.exists() && adminDoc.data().allowed_uids?.includes(user.uid))) {
                    userRole.innerHTML = `<span class="text-emerald-400 font-bold flex items-center gap-1"><span class="material-icons text-sm">verified</span> Authorized Admin</span>`;
                } else {
                    userRole.innerHTML = `<span class="text-slate-300">Standard Account</span>`;
                }
            } catch (e) {
                userRole.textContent = "Standard Account";
            }
        });

        document.getElementById('signOutBtn')?.addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "sign-up-in.html");
        });
    </script>
</body>
</html>
