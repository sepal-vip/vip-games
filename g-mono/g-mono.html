<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Gamers - G-Mono</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { font-family: 'Google Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

  <div class="max-w-md w-full space-y-6">
    
    <!-- Top Navigation -->
    <div class="flex items-center justify-between">
      <a href="/vip-games/" class="p-2.5 rounded-2xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition flex items-center">
        <span class="material-icons">arrow_back</span>
      </a>
      <span class="text-xs font-bold text-amber-500 uppercase tracking-widest">VIP Toolkit</span>
      <div class="w-10"></div>
    </div>

    <!-- Main Header Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl text-center space-y-4">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-amber-500 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-950">
        <span class="material-icons text-3xl">calculate</span>
      </div>
      
      <div>
        <h1 class="text-2xl font-black text-white tracking-tight">G-Mono Hub</h1>
        <p class="text-slate-400 text-xs mt-1">Monopoly Utilities, Calculators & Game Companion Tools</p>
      </div>

      <!-- Quick Action: Score Counter -->
      <div class="pt-2">
        <a href="/vip-games/count.html" class="block w-full bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black p-4 rounded-2xl transition shadow-lg hover:shadow-amber-500/20 flex items-center justify-between">
          <div class="flex items-center gap-3 text-left">
            <div class="w-10 h-10 rounded-xl bg-slate-950/20 flex items-center justify-center">
              <span class="material-icons text-slate-950">scoreboard</span>
            </div>
            <div>
              <p class="text-sm font-black text-slate-950 leading-tight">Score Counter</p>
              <p class="text-[11px] font-bold text-slate-950/70">Indian Board Assets & Net Worth</p>
            </div>
          </div>
          <span class="material-icons text-slate-950">arrow_forward</span>
        </a>
      </div>
    </div>

    <!-- Tools Navigation Grid -->
    <div class="grid grid-cols-2 gap-3">
      <a href="/vip-games/add.html" class="p-4 bg-slate-900/80 border border-slate-800 hover:border-amber-500/50 rounded-2xl transition flex flex-col justify-between space-y-3 group">
        <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-slate-950 transition">
          <span class="material-icons text-base">add_circle_outline</span>
        </div>
        <div>
          <h2 class="text-xs font-bold text-white group-hover:text-amber-400 transition">Add Match</h2>
          <p class="text-[10px] text-slate-400">Record score sheets</p>
        </div>
      </a>

      <a href="/vip-games/view.html" class="p-4 bg-slate-900/80 border border-slate-800 hover:border-amber-500/50 rounded-2xl transition flex flex-col justify-between space-y-3 group">
        <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-slate-950 transition">
          <span class="material-icons text-base">visibility</span>
        </div>
        <div>
          <h2 class="text-xs font-bold text-white group-hover:text-amber-400 transition">Match Overview</h2>
          <p class="text-[10px] text-slate-400">View leaderboards</p>
        </div>
      </a>
    </div>

  </div>

</body>
</html>
