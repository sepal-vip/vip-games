<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 p-4 min-h-screen">
    <div class="max-w-2xl mx-auto bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="material-icons text-amber-500">edit</span> Edit Match Record
            </h1>
            <a href="history.html" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                <span class="material-icons text-sm">arrow_back</span> Back to History
            </a>
        </div>

        <form id="editMatchForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Match Date</label>
                <input type="date" id="matchDate" class="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-sm focus:outline-none focus:border-amber-500 text-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Location</label>
                <input type="text" id="matchLocation" placeholder="e.g. 302 sepal solitaire" class="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-sm focus:outline-none focus:border-amber-500 text-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Players & Net Cash Breakdown</label>
                <div id="playersRowsContainer" class="space-y-3"></div>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl transition shadow">Update Match</button>
        </form>
    </div>

    <script type="module">
        import { db, doc, getDoc, updateDoc } from "../web-info/firebase.js";

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('game');

        const matchDateInput = document.getElementById('matchDate');
        const matchLocationInput = document.getElementById('matchLocation');
        const playersRowsContainer = document.getElementById('playersRowsContainer');
        const editMatchForm = document.getElementById('editMatchForm');

        async function loadMatchData() {
            if (!gameId) {
                alert('No game ID specified in URL.');
                window.location.href = 'history.html';
                return;
            }

            try {
                const docRef = doc(db, "games", "Monopoly", "matches", gameId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    alert('Match not found.');
                    window.location.href = 'history.html';
                    return;
                }

                const data = docSnap.data();
                matchDateInput.value = data.date || '';
                matchLocationInput.value = data.location || '';

                const players = data.players || [];
                renderPlayerInputs(players);
            } catch (err) {
                console.error("Error loading match:", err);
                alert('Failed to load match details.');
            }
        }

        function renderPlayerInputs(players) {
            playersRowsContainer.innerHTML = players.map((p, index) => `
                <div class="flex items-center gap-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800 player-row" data-index="${index}">
                    <div class="flex-1">
                        <label class="block text-[10px] text-slate-400 font-bold uppercase">Player Name</label>
                        <input type="text" value="${p.name || ''}" class="player-name w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-xs text-white" required>
                    </div>
                    <div class="w-32">
                        <label class="block text-[10px] text-slate-400 font-bold uppercase">Net Cash ($)</label>
                        <input type="number" value="${p.cash ?? p.earnings ?? 0}" class="player-cash w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-xs text-white font-mono" required>
                    </div>
                </div>
            `).join('');
        }

        editMatchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const rows = document.querySelectorAll('.player-row');
                const updatedPlayers = [];

                rows.forEach(row => {
                    const name = row.querySelector('.player-name').value.trim();
                    const cash = Number(row.querySelector('.player-cash').value);
                    updatedPlayers.push({
                        name,
                        cash,
                        earnings: cash,
                        isMember: true
                    });
                });

                // Auto-determine winner (highest cash)
                updatedPlayers.sort((a, b) => b.cash - a.cash);
                updatedPlayers.forEach((p, idx) => {
                    p.isWinner = (idx === 0);
                });

                const docRef = doc(db, "games", "Monopoly", "matches", gameId);
                await updateDoc(docRef, {
                    date: matchDateInput.value,
                    location: matchLocationInput.value,
                    players: updatedPlayers
                });

                alert('Match updated successfully!');
                window.location.href = `view.html?game=${encodeURIComponent(gameId)}`;
            } catch (err) {
                console.error("Error updating match:", err);
                alert('Failed to update match record.');
            }
        });

        loadMatchData();
    </script>
</body>
</html>
