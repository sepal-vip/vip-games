<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 p-4">
    <div class="max-w-2xl mx-auto bg-slate-900 p-6 rounded-2xl">
        <form id="editMatchForm" class="space-y-4">
            <input type="date" id="matchDate" class="w-full bg-slate-950 border p-2 rounded">
            <input type="text" id="matchLocation" class="w-full bg-slate-950 border p-2 rounded">
            <div id="playersRowsContainer"></div>
            <button type="submit" class="w-full bg-amber-500 py-2 rounded">Update</button>
        </form>
    </div>
    <script type="module">
        import { db, doc, getDoc, setDoc } from "../web-info/firebase.js";
        const gameId = new URLSearchParams(window.location.search).get('game');
        const container = document.getElementById('playersRowsContainer');

        async function load() {
            const snap = await getDoc(doc(db, "games", "Monopoly", "matches", gameId));
            const data = snap.data();
            document.getElementById('matchDate').value = data.date;
            document.getElementById('matchLocation').value = data.location;
            data.players.forEach(p => {
                container.innerHTML += `
                    <div class="flex gap-2 mb-2">
                        <input class="player-name bg-slate-950 border p-2 flex-1" value="${p.name}">
                        <input type="text" inputmode="decimal" class="player-score bg-slate-950 border p-2 w-24" value="${p.score}">
                    </div>`;
            });
        }
        
        document.getElementById('editMatchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const players = Array.from(document.querySelectorAll('.player-name')).map((n, i) => ({
                name: n.value,
                score: parseFloat(document.querySelectorAll('.player-score')[i].value)
            }));
            await setDoc(doc(db, "games", "Monopoly", "matches", gameId), {
                date: document.getElementById('matchDate').value,
                location: document.getElementById('matchLocation').value,
                players: players
            }, {merge: true});
            window.location.href = "g-mono.html";
        });
        load();
    </script>
</body>
</html>
