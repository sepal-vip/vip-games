<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Gamers - Match Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: 'Google Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 flex flex-col items-center">

  <div class="max-w-2xl w-full space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <a href="/vip-games/" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition flex items-center">
        <span class="material-icons">arrow_back</span>
      </a>
      <h1 class="text-xl font-bold text-white tracking-wide">Match Details</h1>
      <a href="/vip-games/count.html" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition flex items-center">
        <span class="material-icons">calculate</span>
      </a>
    </div>

    <!-- Match Summary Card (Captured for Export) -->
    <div id="viewMatchCard" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
      
      <!-- Match Info -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div>
          <span class="text-xs font-bold text-amber-500 uppercase tracking-widest">Match Result</span>
          <h2 class="text-2xl font-black text-white">Monopoly Classic</h2>
        </div>
        <div class="text-right">
          <p class="text-xs text-slate-400">Match ID</p>
          <p class="text-xs font-mono font-bold text-slate-200">#VIP-9281</p>
        </div>
      </div>

      <!-- Winner Highlight -->
      <div class="p-5 bg-gradient-to-r from-amber-500/20 via-amber-500/10 to-transparent border border-amber-500/30 rounded-2xl flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black">
            <span class="material-icons text-2xl">emoji_events</span>
          </div>
          <div>
            <p class="text-xs text-amber-400 font-bold uppercase tracking-wider">Champion</p>
            <h3 id="winnerName" class="text-lg font-black text-white">Mitansh</h3>
          </div>
        </div>
        <div class="text-right">
          <span id="winnerScore" class="text-2xl font-black text-amber-400">4,250</span>
          <p class="text-[10px] text-slate-400 font-bold uppercase">Total Points</p>
        </div>
      </div>

      <!-- Standings Table -->
      <div class="space-y-2">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Final Standings</h4>
        
        <div class="space-y-2 text-sm">
          <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-6 text-center font-black text-amber-400">1</span>
              <span class="font-bold text-white">Mitansh</span>
            </div>
            <span class="font-mono font-bold text-slate-200">4,250 PTS</span>
          </div>

          <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-6 text-center font-bold text-slate-400">2</span>
              <span class="font-bold text-slate-300">Player 2</span>
            </div>
            <span class="font-mono font-bold text-slate-400">3,100 PTS</span>
          </div>

          <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-6 text-center font-bold text-slate-400">3</span>
              <span class="font-bold text-slate-300">Player 3</span>
            </div>
            <span class="font-mono font-bold text-slate-400">1,850 PTS</span>
          </div>
        </div>
      </div>

      <div class="text-center pt-2">
        <p class="text-[11px] text-slate-500 font-medium">VIP Gamers Official Match Record • Verified</p>
      </div>
    </div>

    <!-- Actions & Social Share -->
    <div class="grid grid-cols-2 gap-3">
      <button id="viewShareBtn" type="button" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition">
        <span class="material-icons text-base">share</span> Share to WhatsApp
      </button>
      <button id="viewCopyLinkBtn" type="button" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition">
        <span class="material-icons text-base">link</span> Copy Link
      </button>
    </div>
  </div>

  <script>
    // Export and Web/WhatsApp Share
    document.getElementById('viewShareBtn').addEventListener('click', async () => {
      const target = document.getElementById('viewMatchCard');
      const shareUrl = window.location.href;
      const shareText = `🏆 Match Results on VIP Gamers Hub!\nCheck Details: ${shareUrl}`;

      try {
        const canvas = await html2canvas(target, {
          backgroundColor: '#020617',
          scale: 2,
          windowWidth: target.scrollWidth + 32
        });

        canvas.toBlob(async (blob) => {
          const image = new File([blob], 'match-results.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [image] })) {
            await navigator.share({
              files: [image],
              title: 'VIP Gamers Match Overview',
              text: shareText
            });
          } else if (navigator.share) {
            await navigator.share({
              title: 'VIP Gamers Match Overview',
              text: shareText,
              url: shareUrl
            });
          } else {
            const wa = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
            window.open(wa, '_blank');
          }
        }, 'image/png');
      } catch (e) {
        console.error('Export error:', e);
      }
    });

    document.getElementById('viewCopyLinkBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      alert('Match link copied!');
    });
  </script>
</body>
</html>
