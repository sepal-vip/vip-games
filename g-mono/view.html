<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Suite - Record Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style> body { font-family: 'Google Sans', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <nav class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="g-mono.html" class="flex items-center gap-1 text-slate-400 hover:text-white text-xs font-semibold transition">
                <span class="material-icons text-sm">arrow_back</span> Monopoly Hub
            </a>
            <div class="flex items-center gap-4">
                <a href="history.html" class="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1">
                    <span class="material-icons text-sm">history</span> History
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
        <div id="inspectorCard" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
            <div id="loadingState" class="py-12 text-center text-slate-400 space-y-3">
                <span class="material-icons text-4xl animate-spin text-amber-500">sync</span>
                <p class="text-sm font-mono">Fetching record details...</p>
            </div>
            
            <div id="inspectorContent" class="hidden space-y-6">
                <!-- Dynamic Content Injected Here -->
            </div>
        </div>
    </main>

    <script type="module">
        import { db, doc, getDoc, collection, getDocs } from "../web-info/firebase.js";

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('game');
        const playerName = urlParams.get('player');

        const loadingState = document.getElementById('loadingState');
        const inspectorContent = document.getElementById('inspectorContent');

        async function initInspector() {
            try {
                if (gameId) {
                    await renderGameView(gameId);
                } else if (playerName) {
                    await renderPlayerView(playerName);
                } else {
                    renderEmptyView();
                }
            } catch (error) {
                loadingState.innerHTML = `<div class="text-red-400 text-center py-8 font-bold">Error loading record.</div>`;
            }
        }

        async function renderGameView(id) {
            const docSnap = await getDoc(doc(db, "games", "Monopoly", "matches", id));

            loadingState.classList.add('hidden');
            inspectorContent.classList.remove('hidden');

            if (!docSnap.exists()) {
                inspectorContent.innerHTML = `<div class="text-center py-8 text-white">Match not found.</div>`;
                return;
            }

            const game = docSnap.data();
            const players = (game.players || []).sort((a, b) => b.score - a.score);
            
            inspectorContent.innerHTML = `
                <div class="border-b border-slate-800 pb-4">
                    <h1 class="text-2xl font-extrabold text-white">Match ID: ${id}</h1>
                    <p class="text-slate-400 text-xs mt-1">Date: ${game.date || 'N/A'} | Venue: ${game.location || 'N/A'}</p>
                </div>
                <table class="w-full text-left text-xs">
                    <thead><tr class="text-slate-400 border-b border-slate-800">
                        <th class="py-2">Rank</th><th class="py-2">Player</th><th class="py-2 text-right">Score</th>
                    </tr></thead>
                    <tbody class="divide-y divide-slate-800">
                        ${players.map((p, i) => {
                            const rank = i + 1;
                            let rankDisp = `${rank}th`;
                            if(rank === 1) rankDisp = "1st 🥇";
                            else if(rank === 2) rankDisp = "2nd 🥈";
                            else if(rank === 3) rankDisp = "3rd 🥉";
                            
                            return `<tr>
                                <td class="py-3 font-bold ${rank <= 3 ? 'text-amber-400' : 'text-slate-400'}">${rankDisp}</td>
                                <td class="py-3 text-white font-medium">${p.name}</td>
                                <td class="py-3 text-right font-mono ${p.score >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${p.score.toLocaleString()}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        async function renderPlayerView(name) {
            const matchesSnap = await getDocs(collection(db, "games", "Monopoly", "matches"));
            loadingState.classList.add('hidden');
            inspectorContent.classList.remove('hidden');

            let totalPlayed = 0, wins = 0, totalScore = 0;
            const history = [];

            matchesSnap.forEach(d => {
                const game = d.data();
                const p = (game.players || []).find(x => x.name.toLowerCase() === name.toLowerCase());
                if(p) {
                    totalPlayed++;
                    if(game.players.sort((a,b)=>b.score-a.score)[0].name.toLowerCase() === name.toLowerCase()) wins++;
                    totalScore += p.score;
                    history.push({id: d.id, date: game.date, score: p.score});
                }
            });

            inspectorContent.innerHTML = `
                <div class="border-b border-slate-800 pb-4">
                    <h1 class="text-2xl font-extrabold text-white">Player: ${name}</h1>
                </div>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div class="bg-slate-950 p-3 rounded-lg"><div class="text-[10px] uppercase text-slate-500">Played</div><div class="font-bold">${totalPlayed}</div></div>
                    <div class="bg-slate-950 p-3 rounded-lg"><div class="text-[10px] uppercase text-slate-500">Wins</div><div class="font-bold text-amber-400">${wins}</div></div>
                    <div class="bg-slate-950 p-3 rounded-lg"><div class="text-[10px] uppercase text-slate-500">Net Cash</div><div class="font-bold ${totalScore >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${totalScore.toLocaleString()}</div></div>
                </div>
            `;
        }

        function renderEmptyView() { inspectorContent.innerHTML = `<p class="text-center">No record selected.</p>`; }

        initInspector();
    </script>
</body>
</html>
