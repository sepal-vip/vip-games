<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Suite - Record Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://sepal-vip.github.io/vip-games/monoploy-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style> body { font-family: 'Google Sans', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">
    <nav class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="g-mono.html" class="flex items-center gap-2 text-slate-300 hover:text-white text-sm font-medium">
                <span class="material-icons text-base">arrow_back</span> Monopoly Hub
                <span class="material-icons text-amber-500 text-base"><img src="https://sepal-vip.github.io/vip-games/monoploy-icon.png" alt="Monopoly Icon" class="w-4 h-4"></span>
            </a>
            <div class="flex items-center gap-3">
                <button id="openShareModalBtn" class="hidden px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition flex items-center gap-1 shadow">
                    <span class="material-icons text-sm">share</span> Share Record
                </button>
                <a href="history.html" class="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1">
                    <span class="material-icons text-sm">history</span> Match History
                </a>
            </div>
        </div>
    </nav>
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
        <div id="shareableSnapshotContainer" class="p-3 sm:p-5 bg-slate-950 rounded-[2rem]">
            <div id="inspectorCard" class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
                <div id="loadingState" class="py-12 text-center text-slate-400 space-y-3">
                    <span class="material-icons text-4xl animate-spin text-amber-500">sync</span>
                    <p class="text-sm font-mono">Fetching record details from Firestore...</p>
                </div>
                <div id="inspectorContent" class="hidden space-y-6"></div>
            </div>
        </div>
    </main>

    <!-- Share Modal -->
    <div id="shareModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-extrabold text-white flex items-center gap-2">
                    <span class="material-icons text-amber-400 text-base">ios_share</span> Share Match / Profile Record
                </h3>
                <button type="button" id="closeShareModalBtn" class="text-slate-400 hover:text-white">
                    <span class="material-icons text-lg">close</span>
                </button>
            </div>
            <p class="text-xs text-slate-400">Choose your preferred sharing option:</p>
            <div class="space-y-2.5">
                <button id="shareLinkOnlyBtn" class="w-full p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-2xl flex items-center justify-between text-left transition">
                    <div>
                        <p class="text-xs font-bold text-white">Share Link Only</p>
                        <p class="text-[10px] text-slate-400">Direct URL to record overview</p>
                    </div>
                    <span class="material-icons text-amber-400 text-sm">link</span>
                </button>
                <button id="copyLinkOnlyBtn" class="w-full p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-2xl flex items-center justify-between text-left transition">
                    <div>
                        <p class="text-xs font-bold text-white">Copy Link</p>
                        <p class="text-[10px] text-slate-400">Copy URL to clipboard</p>
                    </div>
                    <span class="material-icons text-sky-400 text-sm">content_copy</span>
                </button>
                <button id="shareImageOnlyBtn" class="w-full p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-2xl flex items-center justify-between text-left transition">
                    <div>
                        <p class="text-xs font-bold text-white">Share Snapshot Image</p>
                        <p class="text-[10px] text-slate-400">Fixed-ratio scorecard without buttons</p>
                    </div>
                    <span class="material-icons text-emerald-400 text-sm">image</span>
                </button>
                <button id="copyImageOnlyBtn" class="w-full p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-2xl flex items-center justify-between text-left transition">
                    <div>
                        <p class="text-xs font-bold text-white">Copy Snapshot Image</p>
                        <p class="text-[10px] text-slate-400">Copy scorecard directly to clipboard</p>
                    </div>
                    <span class="material-icons text-emerald-400 text-sm">photo</span>
                </button>
                <button id="shareBothBtn" class="w-full p-3.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 rounded-2xl flex items-center justify-between text-left transition">
                    <div>
                        <p class="text-xs font-bold text-amber-300">Share Image + Link Caption (WhatsApp)</p>
                        <p class="text-[10px] text-amber-200/70">Scorecard image with record link in text</p>
                    </div>
                    <span class="material-icons text-amber-400 text-sm">send</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, doc, getDoc, collection, getDocs } from "../web-info/firebase.js";
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('game');
        const playerName = urlParams.get('player');
        const guestName = urlParams.get('guest');
        const loadingState = document.getElementById('loadingState');
        const inspectorContent = document.getElementById('inspectorContent');
        const openShareModalBtn = document.getElementById('openShareModalBtn');
        const shareModal = document.getElementById('shareModal');
        const closeShareModalBtn = document.getElementById('closeShareModalBtn');
        let currentShareDetails = {
            title: "VIP Gamers Monopoly Record",
            caption: "",
            url: ""
        };

        async function initInspector() {
            try {
                if (gameId) {
                    await renderGameView(gameId);
                    setupGameShare(gameId);
                } else if (playerName) {
                    await renderPlayerView(playerName, false);
                    setupPlayerShare(playerName, false);
                } else if (guestName) {
                    await renderPlayerView(guestName, true);
                    setupPlayerShare(guestName, true);
                } else {
                    renderEmptyView();
                }
            } catch (error) {
                loadingState.innerHTML = `
                    <div class="text-red-400 space-y-2">
                        <span class="material-icons text-4xl">error_outline</span>
                        <p class="text-sm">Failed to load record details.</p>
                    </div>
                `;
            }
        }

        async function renderGameView(id) {
            const cleanId = id.trim().replace('_', '-');
            const docRef = doc(db, "games", "Monopoly", "matches", cleanId);
            const docSnap = await getDoc(docRef);
            loadingState.classList.add('hidden');
            inspectorContent.classList.remove('hidden');
            if (!docSnap.exists()) {
                inspectorContent.innerHTML = `
                    <div class="text-center py-8 space-y-3">
                        <span class="material-icons text-amber-500 text-5xl">manage_search</span>
                        <h2 class="text-xl font-bold text-white">Match Not Found</h2>
                        <p class="text-xs text-slate-400 font-mono">No record matching ID "${cleanId}".</p>
                    </div>
                `;
                return;
            }
            const game = docSnap.data();
            const players = game.players || [];
            const sortedPlayers = [...players].sort((a, b) => {
                const cashA = Number(a.earnings ?? a.cash ?? 0);
                const cashB = Number(b.earnings ?? b.cash ?? 0);
                return cashB - cashA;
            });
            const registeredCount = players.filter(p => p.isMember !== false && !p.isGuest).length;
            const isRanked = registeredCount > 2;
            const dateStr = game.date || cleanId.substring(0, 10);

            inspectorContent.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-6 gap-4">
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 class="text-2xl font-black text-white">Match: ${cleanId}</h1>
                            <span class="px-2.5 py-0.5 text-[10px] font-bold uppercase rounded-full ${isRanked ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                                ${isRanked ? 'Ranked Match' : 'Practice / Unranked'}
                            </span>
                        </div>
                        <p class="text-xs text-slate-400 mt-1 flex items-center gap-3">
                            <span>Date: <strong class="text-slate-200 font-mono">${dateStr}</strong></span>
                            <span>Location: <strong class="text-slate-200">${game.location || 'N/A'}</strong></span>
                        </p>
                    </div>
                    <a id="editMatchBtn" href="edit.html?game=${encodeURIComponent(cleanId)}" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-white rounded-xl transition flex items-center gap-1">
                        <span class="material-icons text-sm">edit</span> Edit Record
                    </a>
                </div>
                <div class="space-y-4">
                    <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Player Standings & Breakdown</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="text-slate-400 border-b border-slate-800 text-xs uppercase tracking-wider">
                                    <th class="py-2.5 px-3">Rank</th>
                                    <th class="py-2.5 px-3">Player</th>
                                    <th class="py-2.5 px-3 text-center">Status</th>
                                    <th class="py-2.5 px-3 text-right">Net Earnings</th>
                                    <th class="py-2.5 px-3 text-center">Cities</th>
                                    <th class="py-2.5 px-3 text-center">Stations</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60 text-xs font-mono">
                                ${sortedPlayers.map((p, index) => {
                                    const isMember = p.isMember !== false && !p.isGuest;
                                    const netVal = Number(p.earnings ?? p.cash ?? 0);
                                    return `
                                        <tr class="hover:bg-slate-800/40">
                                            <td class="py-3 px-3 font-bold ${index === 0 ? 'text-amber-400' : 'text-slate-400'}">#${index + 1}</td>
                                            <td class="py-3 px-3 font-semibold text-white font-sans">
                                                <a href="view.html?${isMember ? 'player' : 'guest'}=${encodeURIComponent(p.name)}" class="hover:underline text-amber-400">
                                                    ${p.name}
                                                </a>
                                            </td>
                                            <td class="py-3 px-3 text-center">
                                                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${isMember ? 'bg-blue-950 text-blue-300 border border-blue-800' : 'bg-slate-800 text-slate-400'}">
                                                    ${isMember ? 'Member' : 'Guest'}
                                                </span>
                                            </td>
                                            <td class="py-3 px-3 text-right font-bold ${netVal >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                                                $${netVal.toLocaleString()}
                                            </td>
                                            <td class="py-3 px-3 text-center text-slate-300">${p.cities || 0}</td>
                                            <td class="py-3 px-3 text-center text-slate-300">${p.stations || 0}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            openShareModalBtn.classList.remove('hidden');
        }

        async function renderPlayerView(name, isGuestView) {
            const matchesRef = collection(db, "games", "Monopoly", "matches");
            const snapshot = await getDocs(matchesRef);
            let playedMatches = [];
            let totalWins = 0;
            let totalEarnings = 0;
            let totalCities = 0;
            let totalStations = 0;

            snapshot.forEach(docSnap => {
                const game = docSnap.data();
                const players = game.players || [];
                const pData = players.find(p => p.name?.toLowerCase() === name.toLowerCase());
                if (pData) {
                    const memberCount = players.filter(pl => pl.isMember !== false && !pl.isGuest).length;
                    const isRanked = memberCount > 2;
                    const isWinner = pData.isWinner || false;
                    const cash = Number(pData.earnings ?? pData.cash ?? 0);
                    const c = Number(pData.cities || 0);
                    const s = Number(pData.stations || 0);
                    if (isWinner) totalWins++;
                    totalEarnings += cash;
                    totalCities += c;
                    totalStations += s;
                    playedMatches.push({
                        id: docSnap.id,
                        date: game.date || docSnap.id.substring(0, 10),
                        location: game.location || 'N/A',
                        earnings: cash,
                        isWinner: isWinner,
                        isRanked: isRanked,
                        cities: c,
                        stations: s,
                        totalProps: c + s
                    });
                }
            });

            loadingState.classList.add('hidden');
            inspectorContent.classList.remove('hidden');
            const matchCount = playedMatches.length;
            const winRate = matchCount > 0 ? ((totalWins / matchCount) * 100).toFixed(1) : "0.0";
            playedMatches.sort((a, b) => b.id.localeCompare(a.id));

            inspectorContent.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-6 gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-3xl font-black">
                            ${name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="text-2xl font-black text-white">${name}</h1>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded ${isGuestView ? 'bg-amber-950 text-amber-300 border border-amber-800' : 'bg-blue-950 text-blue-300 border border-blue-800'} uppercase">
                                    ${isGuestView ? 'Guest Player' : 'Member Profile'}
                                </span>
                            </div>
                            <p class="text-xs text-slate-400 mt-1">Player Career Overview</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center space-y-1">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Total Sessions</span>
                        <p class="text-2xl font-black text-white font-mono">${matchCount}</p>
                    </div>
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center space-y-1">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Career Wins</span>
                        <p class="text-2xl font-black text-emerald-400 font-mono">${totalWins}</p>
                        <span class="text-[9px] text-slate-500 font-medium block">${winRate}% Win Rate</span>
                    </div>
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center space-y-1">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Net Total Cash</span>
                        <p class="text-2xl font-black font-mono ${totalEarnings >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                            $${totalEarnings.toLocaleString()}
                        </p>
                    </div>
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center space-y-1">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Properties</span>
                        <p class="text-2xl font-black text-amber-400 font-mono">${totalCities + totalStations}</p>
                        <span class="text-[9px] text-slate-500 font-medium block">${totalCities} Cities, ${totalStations} Stations</span>
                    </div>
                </div>

                <div class="space-y-3 pt-4 border-t border-slate-800">
                    <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Historical Match Archive</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="text-slate-400 border-b border-slate-800 text-xs uppercase tracking-wider">
                                    <th class="py-2.5 px-3">Game ID</th>
                                    <th class="py-2.5 px-3">Date</th>
                                    <th class="py-2.5 px-3">Location</th>
                                    <th class="py-2.5 px-3 text-center">Result</th>
                                    <th class="py-2.5 px-3 text-right">Net Cash</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60 text-xs font-mono">
                                ${playedMatches.map(m => `
                                    <tr class="hover:bg-slate-800/30">
                                        <td class="py-3 px-3 font-bold text-amber-400">
                                            <a href="view.html?game=${encodeURIComponent(m.id)}" class="hover:underline">
                                                ${m.id}
                                            </a>
                                        </td>
                                        <td class="py-3 px-3 text-slate-300">${m.date}</td>
                                        <td class="py-3 px-3 text-slate-200 font-sans">${m.location}</td>
                                        <td class="py-3 px-3 text-center font-bold font-sans ${m.isWinner ? 'text-emerald-400' : 'text-slate-500'}">
                                            ${m.isWinner ? 'Winner' : 'Participant'}
                                        </td>
                                        <td class="py-3 px-3 text-right font-bold ${m.earnings >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                                            $${m.earnings.toLocaleString()}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            openShareModalBtn.classList.remove('hidden');
        }

        function renderEmptyView() {
            loadingState.classList.add('hidden');
            inspectorContent.classList.remove('hidden');
            inspectorContent.innerHTML = `
                <div class="text-center py-8 space-y-3">
                    <span class="material-icons text-amber-500 text-5xl">help_outline</span>
                    <h2 class="text-xl font-bold text-white">Missing Query Parameters</h2>
                    <p class="text-xs text-slate-400">Specify ?game=ID, ?player=Name, or ?guest=Name</p>
                </div>
            `;
        }

        function setupGameShare(id) {
            currentShareDetails.url = window.location.href;
            currentShareDetails.title = `Monopoly Match Record: ${id}`;
            currentShareDetails.caption = `Monopoly Match Session ${id} Record: ${window.location.href}`;
        }

        function setupPlayerShare(name, isGuest) {
            currentShareDetails.url = window.location.href;
            currentShareDetails.title = `Monopoly ${isGuest ? 'Guest' : 'Player'} Profile: ${name}`;
            currentShareDetails.caption = `${name}'s Monopoly Standings & Stats: ${window.location.href}`;
        }

        openShareModalBtn.addEventListener('click', () => shareModal.classList.remove('hidden'));
        closeShareModalBtn.addEventListener('click', () => shareModal.classList.add('hidden'));

        document.getElementById('shareLinkOnlyBtn').addEventListener('click', async () => {
            if (navigator.share) {
                await navigator.share({ title: currentShareDetails.title, url: currentShareDetails.url });
            } else {
                navigator.clipboard.writeText(currentShareDetails.url);
                alert('Record Link Copied: ' + currentShareDetails.url);
            }
            shareModal.classList.add('hidden');
        });

        document.getElementById('copyLinkOnlyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(currentShareDetails.url);
            alert('Record Link Copied: ' + currentShareDetails.url);
            shareModal.classList.add('hidden');
        });

        async function captureSnapshotBlob() {
            const editBtn = document.getElementById('editMatchBtn');
            if (editBtn) editBtn.style.display = 'none';
            const container = document.getElementById('shareableSnapshotContainer');
            const originalStyle = container.getAttribute('style') || '';
            container.style.width = '720px';
            container.style.maxWidth = '720px';
            const canvas = await html2canvas(container, {
                backgroundColor: '#020617',
                scale: 2,
                useCORS: true,
                windowWidth: 1024
            });
            container.setAttribute('style', originalStyle);
            if (editBtn) editBtn.style.display = '';
            return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        }

        document.getElementById('shareImageOnlyBtn').addEventListener('click', async () => {
            try {
                const blob = await captureSnapshotBlob();
                const file = new File([blob], 'monopoly-record.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: currentShareDetails.title });
                } else {
                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'monopoly-record.png';
                    a.click();
                }
            } catch (err) {}
            shareModal.classList.add('hidden');
        });

        document.getElementById('copyImageOnlyBtn').addEventListener('click', async () => {
            try {
                const blob = await captureSnapshotBlob();
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                alert('Snapshot image copied to clipboard!');
            } catch (err) {
                const blob = await captureSnapshotBlob();
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'monopoly-record.png';
                a.click();
            }
            shareModal.classList.add('hidden');
        });

        document.getElementById('shareBothBtn').addEventListener('click', async () => {
            try {
                const blob = await captureSnapshotBlob();
                const file = new File([blob], 'monopoly-record.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: currentShareDetails.title,
                        text: currentShareDetails.caption
                    });
                } else {
                    const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(currentShareDetails.caption)}`;
                    window.open(waUrl, '_blank');
                }
            } catch (err) {
                const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(currentShareDetails.caption)}`;
                window.open(waUrl, '_blank');
            }
            shareModal.classList.add('hidden');
        });

        initInspector();
    </script>
</body>
</html>
