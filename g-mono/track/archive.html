<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Tracker - Saved & Archived Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://sepal-vip.github.io/vip-games/monoploy-icon.png">
    <link rel="stylesheet" href="../../web-info/global-style.css">
    <script src="../../web-info/theme.js"></script>
    <style>
        body { font-family: 'Google Sans', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden selection:bg-amber-500 selection:text-slate-950">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="glass-panel sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="../tracker.html" class="flex items-center gap-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white text-sm font-medium transition">
                <span class="material-icons text-base">arrow_back</span> Tracker Hub
                <img src="https://sepal-vip.github.io/vip-games/monoploy-icon.png" alt="Monopoly Icon" class="w-4 h-4">
            </a>
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="text-slate-600 dark:text-slate-300 hover:text-amber-500 transition-colors">
                    <span class="material-icons text-lg" id="themeIcon">light_mode</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-6 relative z-10">
        <header class="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 ring-1 ring-amber-500/20">
            <div>
                <h1 class="text-2xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                    <span class="material-icons text-amber-500">inventory_2</span> Saved Sessions &amp; Archives
                </h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Reactivate paused games or inspect completed session ledgers.</p>
            </div>
            <div class="flex rounded-2xl bg-white/40 dark:bg-slate-950/70 p-1 border border-slate-200 dark:border-slate-800 text-xs font-bold">
                <button id="tabSavedBtn" class="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 transition shadow-sm">Saved for Later</button>
                <button id="tabArchivedBtn" class="px-4 py-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-white transition">Ended / Archived</button>
            </div>
        </header>

        <div id="gamesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-full py-12 text-center text-xs text-slate-500">Loading saved records...</div>
        </div>
    </main>

    <script type="module">
        import { db, collection, getDocs, doc, setDoc, deleteDoc } from "../../web-info/firebase.js";

        let currentTab = "saved";
        const tabSavedBtn = document.getElementById('tabSavedBtn');
        const tabArchivedBtn = document.getElementById('tabArchivedBtn');
        const gamesContainer = document.getElementById('gamesContainer');

        tabSavedBtn.onclick = () => {
            currentTab = "saved";
            tabSavedBtn.className = "px-4 py-2 rounded-xl bg-amber-500 text-slate-950 transition shadow-sm";
            tabArchivedBtn.className = "px-4 py-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-white transition";
            loadRecords();
        };

        tabArchivedBtn.onclick = () => {
            currentTab = "archived";
            tabArchivedBtn.className = "px-4 py-2 rounded-xl bg-amber-500 text-slate-950 transition shadow-sm";
            tabSavedBtn.className = "px-4 py-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-white transition";
            loadRecords();
        };

        async function loadRecords() {
            gamesContainer.innerHTML = `<div class="col-span-full py-12 text-center text-xs text-slate-500">Fetching records...</div>`;
            const collectionPath = currentTab === "saved" 
                ? collection(db, "games", "Monopoly", "saved_games") 
                : collection(db, "games", "Monopoly", "archived_rooms");

            try {
                const snap = await getDocs(collectionPath);
                if (snap.empty) {
                    gamesContainer.innerHTML = `<div class="col-span-full py-12 text-center text-xs text-slate-500">No ${currentTab} sessions found.</div>`;
                    return;
                }

                gamesContainer.innerHTML = '';
                snap.forEach(d => {
                    const data = d.data();
                    const code = data.roomCode || d.id;
                    const date = data.createdAt ? new Date(data.createdAt).toLocaleDateString() : 'N/A';
                    const players = data.players || {};
                    const pNames = Object.keys(players).join(', ');

                    const card = document.createElement('div');
                    card.className = "glass-panel p-5 rounded-3xl space-y-4 shadow-xl flex flex-col justify-between";
                    card.innerHTML = `
                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="font-mono font-black text-amber-500 text-sm">${code}</span>
                                    <span class="text-[9px] font-bold uppercase px-2 py-0.5 rounded-full border bg-white/40 dark:bg-slate-900 border-slate-200 dark:border-slate-800">
                                        ${data.status || (currentTab === "saved" ? "Paused" : "Archived")}
                                    </span>
                                </div>
                                <span class="text-[10px] text-slate-500 font-mono">${date}</span>
                            </div>
                            <div class="text-xs font-semibold text-slate-800 dark:text-slate-200">
                                Host: ${data.hostName || 'Unknown'}
                            </div>
                            <div class="text-[11px] text-slate-400">
                                Players: <span class="text-slate-300 font-medium">${pNames || 'None'}</span>
                            </div>
                            ${data.officialMatchId ? `
                                <div class="text-[10px] text-emerald-500 font-mono">
                                    Logged to Official Matches: ${data.officialMatchId}
                                </div>
                            ` : ''}
                        </div>
                        <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                            <button class="btn-reactivate px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-sm flex items-center gap-1">
                                <span class="material-icons text-sm">play_arrow</span> Reactivate Table
                            </button>
                            ${data.countUrl ? `
                                <a href="${data.countUrl}" class="px-3 py-1.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 font-bold rounded-xl text-xs transition flex items-center gap-1">
                                    <span class="material-icons text-sm">calculate</span> Scorecard
                                </a>
                            ` : ''}
                        </div>
                    `;

                    card.querySelector('.btn-reactivate').onclick = async () => {
                        if (!confirm(`Reactivate room ${code} back to live sessions?`)) return;
                        // Move back to active rooms collection
                        await setDoc(doc(db, "games", "Monopoly", "rooms", code), {
                            ...data,
                            status: "Active",
                            reactivatedAt: new Date().toISOString()
                        });
                        // Remove from current collection
                        await deleteDoc(doc(collectionPath, d.id));
                        window.location.href = `game.html?code=${code}&user=${encodeURIComponent(data.hostName || '')}&role=master`;
                    };

                    gamesContainer.appendChild(card);
                });
            } catch (err) {
                gamesContainer.innerHTML = `<div class="col-span-full py-12 text-center text-xs text-rose-500">Error: ${err.message}</div>`;
            }
        }

        loadRecords();
    </script>
</body>
</html>
