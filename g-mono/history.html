<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Suite - Match History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style> body { font-family: 'Google Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="g-mono.html" class="flex items-center gap-2 text-slate-300 hover:text-white text-sm font-medium">
                <span class="material-icons text-base">arrow_back</span> Monopoly Suite
            </a>
            <div class="flex items-center gap-3">
                <a href="add.html" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded-xl transition flex items-center gap-1 shadow">
                    <span class="material-icons text-sm">add_circle</span> Record Match
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-6">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-700/60 pb-6">
                <div>
                    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                        📜 Monopoly Match History
                    </h1>
                    <p class="text-xs text-slate-400 mt-1">Review all logged game sessions, ranked status (>2 members), locations, and cash breakdowns.</p>
                </div>
                <div class="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700/60">
                    Format: <span class="text-amber-400 font-bold">DD-MM-YYYY-ID</span>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700/50">
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Search Game ID / Location / Player</label>
                    <div class="relative">
                        <span class="material-icons absolute left-3 top-2.5 text-slate-500 text-sm">search</span>
                        <input type="text" id="searchInput" placeholder="Search by game ID (e.g. 01-08-2026-01) or player..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Match Type Filter</label>
                    <select id="typeFilter" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-amber-500">
                        <option value="all">All Matches</option>
                        <option value="ranked">Ranked Only (>2 Members)</option>
                        <option value="unranked">Practice / Guest Only</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-700 text-xs uppercase tracking-wider">
                            <th class="py-3 px-3">Game ID</th>
                            <th class="py-3 px-3">Date</th>
                            <th class="py-3 px-3">Location</th>
                            <th class="py-3 px-3 text-center">Players</th>
                            <th class="py-3 px-3">Winner</th>
                            <th class="py-3 px-3 text-center">Status</th>
                            <th class="py-3 px-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-slate-700/50 text-xs">
                        <tr>
                            <td colspan="7" class="py-8 text-center text-slate-400">Loading match history logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <script type="module">
        import { db, collection, getDocs } from "../web-info/firebase.js";

        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const historyTableBody = document.getElementById('historyTableBody');

        let allMatches = [];

        async function fetchMatchHistory() {
            try {
                const matchesRef = collection(db, "games", "Monopoly", "matches");
                const snapshot = await getDocs(matchesRef);

                allMatches = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const players = data.players || [];
                    const memberCount = players.filter(p => p.isMember !== false && !p.isGuest).length;
                    const winnerObj = players.find(p => p.isWinner) || players[0] || {};

                    allMatches.push({
                        id: docSnap.id,
                        date: data.date || docSnap.id.substring(0, 10),
                        location: data.location || 'N/A',
                        playersCount: players.length,
                        memberCount: memberCount,
                        isRanked: memberCount > 2, // Strictly > 2 members rule
                        winner: winnerObj.name || 'N/A',
                        players: players
                    });
                });

                // Sort descending by ID / Date
                allMatches.sort((a, b) => b.id.localeCompare(a.id));
                renderHistory();
            } catch (err) {
                console.error("Fetch History Error:", err);
                historyTableBody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-400">Unable to load match logs from Firestore.</td></tr>`;
            }
        }

        function renderHistory() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const filterVal = typeFilter.value;

            const filtered = allMatches.filter(m => {
                const matchesSearch = m.id.toLowerCase().includes(searchTerm) ||
                                     m.location.toLowerCase().includes(searchTerm) ||
                                     m.winner.toLowerCase().includes(searchTerm) ||
                                     m.players.some(p => p.name?.toLowerCase().includes(searchTerm));

                if (!matchesSearch) return false;

                if (filterVal === 'ranked') return m.isRanked;
                if (filterVal === 'unranked') return !m.isRanked;
                return true;
            });

            if (filtered.length === 0) {
                historyTableBody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400">No matching game records found.</td></tr>`;
                return;
            }

            historyTableBody.innerHTML = filtered.map(m => `
                <tr class="hover:bg-slate-800/40 transition">
                    <td class="py-3 px-3 font-mono font-bold text-amber-400">
                        <a href="view.html?game=${encodeURIComponent(m.id)}" class="hover:underline flex items-center gap-1">
                            <span>${m.id}</span>
                            <span class="material-icons text-xs">open_in_new</span>
                        </a>
                    </td>
                    <td class="py-3 px-3 font-mono text-slate-300">${m.date}</td>
                    <td class="py-3 px-3 text-slate-200">${m.location}</td>
                    <td class="py-3 px-3 text-center font-mono text-slate-300">${m.playersCount}</td>
                    <td class="py-3 px-3 font-semibold text-white flex items-center gap-1">
                        <span>🥇</span>
                        <a href="view.html?player=${encodeURIComponent(m.winner)}" class="hover:underline text-amber-300">${m.winner}</a>
                    </td>
                    <td class="py-3 px-3 text-center">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${m.isRanked ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                            ${m.isRanked ? 'Ranked' : 'Practice'}
                        </span>
                    </td>
                    <td class="py-3 px-3 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <a href="view.html?game=${encodeURIComponent(m.id)}" class="p-1 text-slate-400 hover:text-white rounded transition" title="Inspect Game">
                                <span class="material-icons text-base">visibility</span>
                            </a>
                            <a href="edit.html?game=${encodeURIComponent(m.id)}" class="p-1 text-slate-400 hover:text-amber-400 rounded transition" title="Edit Record">
                                <span class="material-icons text-base">edit</span>
                            </a>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        searchInput.addEventListener('input', renderHistory);
        typeFilter.addEventListener('change', renderHistory);

        fetchMatchHistory();
    </script>
</body>
</html>
