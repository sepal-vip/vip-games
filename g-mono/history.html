<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Suite - Match History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="icon" type="image/png" href="https://sepal-vip.github.io/vip-games/monoploy-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Global Liquid Glass Stylesheet & Theme Controller -->
    <link rel="stylesheet" href="../web-info/global-style.css">
    <script src="../web-info/theme.js"></script>

    <style> 
        body { font-family: 'Google Sans', sans-serif; } 
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white transition-colors duration-500 relative overflow-x-hidden">
    
    <!-- Liquid Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Top Navigation -->
    <nav class="glass-panel sticky top-0 z-50 transition-colors duration-500">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="g-mono.html" class="flex items-center gap-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white text-sm font-medium transition">
                <span class="material-icons text-base">arrow_back</span> Monopoly Suite
                <img src="https://sepal-vip.github.io/vip-games/monoploy-icon.png" alt="Monopoly Icon" class="w-4 h-4">
            </a>
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="text-slate-600 dark:text-slate-300 hover:text-blue-500 transition-colors" title="Toggle Theme">
                    <span class="material-icons" id="themeIcon">light_mode</span>
                </button>
                <a href="add.html" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition flex items-center gap-1 shadow-md shadow-blue-600/20 border border-blue-400/30">
                    <span class="material-icons text-sm">add_circle</span> Record Match
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-6 relative z-10">
        
        <!-- Header Banner Glass Card -->
        <header class="glass-panel border-blue-500/20 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 ring-1 ring-blue-500/10">
            <div>
                <h1 class="text-2xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                    <span class="material-icons text-blue-500">history</span> Monopoly Match Archive
                </h1>
                <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">Explore past sessions grouped by month, sorted newest first, with player telemetry and winner margins.</p>
            </div>
            <div id="statsSummaryBadge" class="text-xs text-slate-700 dark:text-slate-300 font-mono bg-white/40 dark:bg-slate-950/70 px-3.5 py-2 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                Total Sessions: <span id="totalMatchesCount" class="text-blue-600 dark:text-blue-400 font-bold">0</span>
            </div>
        </header>

        <!-- Search and Quick Filter Bar -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 glass-panel p-4 rounded-3xl shadow-xl">
            <div class="sm:col-span-1 relative">
                <span class="material-icons absolute left-3 top-2.5 text-slate-400 text-sm">search</span>
                <input type="text" id="searchInput" placeholder="Search player, ID, or venue..." class="w-full bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-blue-500 font-sans shadow-inner">
            </div>
            <div>
                <select id="monthJumpSelect" class="w-full bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-blue-500 shadow-inner">
                    <option value="ALL">All Months</option>
                </select>
            </div>
            <div>
                <select id="typeFilter" class="w-full bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-blue-500 shadow-inner">
                    <option value="all">All Match Types</option>
                    <option value="ranked">Ranked Only (&gt;2 Members)</option>
                    <option value="unranked">Practice / Casual Only</option>
                </select>
            </div>
        </div>

        <!-- Grouped Match Cards Container -->
        <div id="groupedMatchesContainer" class="space-y-8">
            <div class="py-16 text-center text-slate-500 font-sans text-xs">
                Loading game sessions from Firestore...[cite: 1]
            </div>
        </div>
    </main>

    <script type="module">
        import { db, collection, getDocs } from "../web-info/firebase.js";

        if (localStorage.getItem('debugging') === null) {
            localStorage.setItem('debugging', '0');
        }
        function debugLog(...args) {
            if (localStorage.getItem('debugging') === '1') {
                console.log("[DEBUG:history.html]", ...args);
            }
        }
        debugLog("Initializing History page script...");

        const searchInput = document.getElementById('searchInput');
        const monthJumpSelect = document.getElementById('monthJumpSelect');
        const typeFilter = document.getElementById('typeFilter');
        const groupedMatchesContainer = document.getElementById('groupedMatchesContainer');
        const totalMatchesCount = document.getElementById('totalMatchesCount');
        let rawMatches = [];

        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        function parseDate(dateStr) {
            if (!dateStr) return { ts: 0, year: "Unknown", month: "Unknown", label: "Unknown Date" };
            const clean = dateStr.trim();
            const parts = clean.split(/[-/]/);
            let y = 0, m = 0, d = 0;
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    y = parseInt(parts[0]);
                    m = parseInt(parts[1]) - 1;
                    d = parseInt(parts[2]);
                } else {
                    d = parseInt(parts[0]);
                    m = parseInt(parts[1]) - 1;
                    y = parseInt(parts[2]);
                }
            }
            const dateObj = new Date(y, m, d);
            const ts = isNaN(dateObj.getTime()) ? 0 : dateObj.getTime();
            const monthName = !isNaN(m) && m >= 0 && m < 12 ? monthNames[m] : "Unknown";
            return {
                ts,
                year: String(y),
                month: monthName,
                groupKey: `${monthName} ${y}`,
                monthIndex: m,
                formatted: `${String(d).padStart(2, '0')} ${monthName} ${y}`
            };
        }

        async function fetchMatches() {
            try {
                const snapshot = await getDocs(collection(db, "games", "Monopoly", "matches"));
                rawMatches = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const players = data.players || [];
                    const memberCount = players.filter(p => p.isMember !== false && !p.isGuest).length;
                    const dateParsed = parseDate(data.date || docSnap.id.substring(0, 10));

                    const winnerObj = players.find(p => p.isWinner) ||
                                      [...players].sort((a, b) => Number(b.earnings ?? b.cash ?? 0) - Number(a.earnings ?? a.cash ?? 0))[0] ||
                                      {};

                    rawMatches.push({
                        id: docSnap.id,
                        dateRaw: data.date || docSnap.id.substring(0, 10),
                        parsedDate: dateParsed,
                        location: data.location || "Living Room",
                        players: players,
                        isRanked: memberCount > 2,
                        memberCount: memberCount,
                        winnerName: winnerObj.name || "N/A",
                        winnerNet: Number(winnerObj.earnings ?? winnerObj.cash ?? 0)
                    });
                });

                rawMatches.sort((a, b) => {
                    if (b.parsedDate.ts !== a.parsedDate.ts) {
                        return b.parsedDate.ts - a.parsedDate.ts;
                    }
                    return b.id.localeCompare(a.id);
                });

                totalMatchesCount.textContent = rawMatches.length;
                populateMonthDropdown();
                renderGroupedCards();
            } catch (err) {
                debugLog("Fetch error:", err);
                groupedMatchesContainer.innerHTML = `
                    <div class="py-16 text-center text-rose-500 font-sans text-xs">
                        Failed to load match archive from Firestore.
                    </div>
                `;
            }
        }

        function populateMonthDropdown() {
            const groups = new Set();
            rawMatches.forEach(m => {
                if (m.parsedDate.groupKey && !m.parsedDate.groupKey.includes("Unknown")) {
                    groups.add(m.parsedDate.groupKey);
                }
            });
            monthJumpSelect.innerHTML = `<option value="ALL">All Months (${groups.size} recorded)</option>`;
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                monthJumpSelect.appendChild(opt);
            });
        }

        function renderGroupedCards() {
            const query = searchInput.value.toLowerCase().trim();
            const filterMonth = monthJumpSelect.value;
            const filterType = typeFilter.value;

            const filtered = rawMatches.filter(m => {
                if (filterMonth !== "ALL" && m.parsedDate.groupKey !== filterMonth) return false;
                if (filterType === "ranked" && !m.isRanked) return false;
                if (filterType === "unranked" && m.isRanked) return false;
                if (query) {
                    const matchId = m.id.toLowerCase().includes(query);
                    const matchLoc = m.location.toLowerCase().includes(query);
                    const matchWinner = m.winnerName.toLowerCase().includes(query);
                    const matchPlayer = m.players.some(p => (p.name || "").toLowerCase().includes(query));
                    if (!matchId && !matchLoc && !matchWinner && !matchPlayer) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                groupedMatchesContainer.innerHTML = `
                    <div class="py-16 text-center text-slate-500 font-sans text-xs">
                        No matches found matching your current search or month filter.
                    </div>
                `;
                return;
            }

            const groupsMap = new Map();
            filtered.forEach(m => {
                const key = m.parsedDate.groupKey;
                if (!groupsMap.has(key)) {
                    groupsMap.set(key, []);
                }
                groupsMap.get(key).push(m);
            });

            let html = "";
            groupsMap.forEach((matches, monthKey) => {
                html += `
                    <div class="space-y-4">
                        <div class="flex items-center gap-3 border-b border-slate-200 dark:border-slate-800/80 pb-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                            <h2 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-wider">${monthKey}</h2>
                            <span class="text-[10px] font-mono text-slate-500 font-bold bg-white/40 dark:bg-slate-900 px-2.5 py-0.5 rounded-full border border-slate-200 dark:border-slate-800 shadow-sm">
                                ${matches.length} session${matches.length > 1 ? 's' : ''}
                            </span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${matches.map(m => `
                                <div class="glass-panel rounded-3xl p-5 hover:border-blue-500/40 transition flex flex-col justify-between space-y-4 shadow-xl">
                                    <div class="space-y-3">
                                        <div class="flex items-start justify-between gap-2">
                                            <div>
                                                <a href="view.html?game=${encodeURIComponent(m.id)}" class="text-blue-600 dark:text-blue-400 font-mono font-bold text-xs hover:underline flex items-center gap-1">
                                                    <span>${m.id}</span>
                                                    <span class="material-icons text-xs">open_in_new</span>
                                                </a>
                                                <div class="text-[11px] text-slate-500 font-medium mt-0.5 flex items-center gap-2">
                                                    <span>${m.parsedDate.formatted}</span>
                                                    <span>•</span>
                                                    <span class="text-slate-400">${m.location}</span>
                                                </div>
                                            </div>
                                            <span class="text-[9px] font-bold uppercase px-2.5 py-0.5 rounded-full border ${m.isRanked ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700'}">
                                                ${m.isRanked ? 'Ranked' : 'Practice'}
                                            </span>
                                        </div>
                                        <div class="bg-white/40 dark:bg-slate-950/70 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center justify-between shadow-sm">
                                            <div class="flex items-center gap-2">
                                                <span class="material-icons text-amber-500 text-base">emoji_events</span>
                                                <div>
                                                    <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Winner</div>
                                                    <div class="text-xs font-bold text-slate-900 dark:text-white font-sans">${m.winnerName}</div>
                                                </div>
                                            </div>
                                            <div class="text-right font-mono">
                                                <div class="text-[10px] text-slate-400 uppercase font-bold">Earnings</div>
                                                <div class="text-xs font-bold ${m.winnerNet >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}">
                                                    $${m.winnerNet.toLocaleString()}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="space-y-1.5">
                                            <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">
                                                Participants (${m.players.length})
                                            </div>
                                            <div class="flex flex-wrap gap-1.5">
                                                ${m.players.map(p => {
                                                    const isMember = p.isMember !== false && !p.isGuest;
                                                    const isWin = p.isWinner || p.name === m.winnerName;
                                                    return `
                                                        <span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-lg border font-mono ${
                                                            isWin ? 'bg-amber-500/15 text-amber-700 dark:text-amber-300 border-amber-500/30 font-bold' : 
                                                            isMember ? 'bg-white/50 dark:bg-slate-950 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800' : 
                                                            'bg-white/30 dark:bg-slate-950/60 text-slate-400 border-slate-200/60 dark:border-slate-800/60'
                                                        }">
                                                            <span class="w-1.5 h-1.5 rounded-full ${isWin ? 'bg-amber-500' : isMember ? 'bg-blue-500' : 'bg-slate-400'}"></span>
                                                            <span>${p.name || 'Player'}</span>
                                                        </span>
                                                    `;
                                                }).join('')}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs">
                                        <a href="view.html?game=${encodeURIComponent(m.id)}" class="text-slate-500 hover:text-slate-900 dark:hover:text-white font-medium flex items-center gap-1 transition">
                                            <span class="material-icons text-sm">visibility</span>
                                            <span>Full Record</span>
                                        </a>
                                        <a href="edit.html?game=${encodeURIComponent(m.id)}" class="text-blue-600 dark:text-blue-400 hover:underline font-bold flex items-center gap-1 transition">
                                            <span class="material-icons text-sm">edit</span>
                                            <span>Edit Session</span>
                                        </a>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            groupedMatchesContainer.innerHTML = html;
        }

        searchInput.addEventListener('input', renderGroupedCards);
        monthJumpSelect.addEventListener('change', renderGroupedCards);
        typeFilter.addEventListener('change', renderGroupedCards);
        fetchMatches();
    </script>
    
    <!-- Offline Service Worker Bootstrap -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
            });
        }
        window.addEventListener('offline', () => {
            window.location.href = '/offline.html';
        });
    </script>
</body>
</html>
