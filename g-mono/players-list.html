<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Member Directory & Guest View</title>
    <link rel="icon" type="image/png" href="https://sepal-vip.github.io/vip-games/monoploy-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style> body { font-family: 'Google Sans', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">
    <nav class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="g-mono.html" class="flex items-center gap-1 text-slate-400 hover:text-white text-xs font-semibold transition">
                    <span class="material-icons text-sm">arrow_back</span> Monopoly Suite
                    <span class="material-icons text-amber-500 text-base"><img src="https://sepal-vip.github.io/vip-games/monoploy-icon.png" alt="Vip Icon" class="w-4 h-4"></span>
                </a>
                <span class="text-slate-700">|</span>
                <span class="text-amber-400 font-extrabold text-sm flex items-center gap-1.5">
                    <span class="material-icons text-base text-amber-500">group</span> Member Directory & Guests
                </span>
            </div>
            <a href="leaderboard.html" class="text-xs bg-slate-900 hover:bg-slate-800 text-slate-300 px-3.5 py-1.5 rounded-xl border border-slate-800 font-medium transition flex items-center gap-1">
                <span class="material-icons text-sm text-amber-400">emoji_events</span> Standings
            </a>
        </div>
    </nav>
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <header class="bg-gradient-to-r from-amber-950/40 via-slate-900 to-slate-900 border border-amber-500/30 rounded-3xl p-6 shadow-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-white">Registered Members & Guest Players</h1>
                <p class="text-xs text-slate-400 mt-1">Official member directory loaded from Firestore <code class="bg-slate-950 px-1 rounded text-amber-300">/players</code> and guest participants.</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="text" id="playerSearchInput" placeholder="Search member or guest..." class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
            </div>
        </header>
        <div id="playersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-12 text-center text-slate-500 font-sans">
                Loading registered members and guest players...
            </div>
        </div>
    </main>
    <script type="module">
        import { db, collection, getDocs } from "../web-info/firebase.js";
        const playersGrid = document.getElementById('playersGrid');
        const playerSearchInput = document.getElementById('playerSearchInput');
        let membersData = [];
        let guestNamesSet = new Set();
        let matchesData = [];

        async function loadDirectoryData() {
            try {
                const membersSnap = await getDocs(collection(db, "players"));
                membersData = [];
                membersSnap.forEach(d => {
                    membersData.push({ name: d.id, isGuest: false, ...d.data() });
                });

                const matchesSnap = await getDocs(collection(db, "games", "Monopoly", "matches"));
                matchesData = [];
                matchesSnap.forEach(d => {
                    const data = d.data();
                    matchesData.push({ id: d.id, ...data });
                    (data.players || []).forEach(p => {
                        if (p.isGuest || p.isMember === false) {
                            if (p.name) guestNamesSet.add(p.name);
                        }
                    });
                });

                guestNamesSet.forEach(gName => {
                    if (!membersData.some(m => m.name.toLowerCase() === gName.toLowerCase())) {
                        membersData.push({ name: gName, isGuest: true, note: "Guest Participant" });
                    }
                });

                renderPlayers();
            } catch (err) {
                playersGrid.innerHTML = `<div class="col-span-full py-12 text-center text-red-400 font-bold">Failed to load directory.</div>`;
            }
        }

        function renderPlayers() {
            const query = playerSearchInput.value.toLowerCase().trim();
            const filtered = membersData.filter(m => m.name.toLowerCase().includes(query));
            if (filtered.length === 0) {
                playersGrid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500">No members or guests match search query.</div>`;
                return;
            }
            playersGrid.innerHTML = filtered.map(member => {
                const name = member.name;
                const isGuest = member.isGuest;
                let totalPlayed = 0;
                let wins = 0;
                let totalScore = 0;
                let bestScore = -Infinity;

                matchesData.forEach(m => {
                    const players = m.players || [];
                    players.forEach((p, idx) => {
                        if ((p.name || '').toLowerCase() === name.toLowerCase()) {
                            totalPlayed++;
                            if (p.isWinner || idx === 0) wins++;
                            const cashVal = Number(p.cash ?? p.earnings ?? 0);
                            totalScore += cashVal;
                            if (cashVal > bestScore) bestScore = cashVal;
                        }
                    });
                });
                if (bestScore === -Infinity) bestScore = 0;
                const winRate = totalPlayed > 0 ? ((wins / totalPlayed) * 100).toFixed(1) : "0.0";

                return `
                    <a href="view.html?${isGuest ? 'guest' : 'player'}=${encodeURIComponent(name)}" class="bg-slate-900/90 border border-slate-800 hover:border-amber-500/50 rounded-3xl p-6 space-y-4 shadow-xl flex flex-col justify-between transition group">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg group-hover:bg-amber-500 group-hover:text-slate-950 transition">
                                        ${name.charAt(0).toUpperCase()}
                                    </div>
                                    <div>
                                        <h2 class="text-base font-extrabold text-white group-hover:text-amber-400 transition">${name}</h2>
                                        <span class="text-[9px] font-bold uppercase px-2 py-0.5 rounded ${isGuest ? 'bg-amber-950 text-amber-300 border border-amber-800' : 'bg-blue-950 text-blue-300 border border-blue-800'}">
                                            ${isGuest ? 'Guest Player' : 'Registered Member'}
                                        </span>
                                    </div>
                                </div>
                                <span class="material-icons text-slate-600 group-hover:text-amber-400 transition">open_in_new</span>
                            </div>
                            <div class="grid grid-cols-3 gap-2 pt-2 text-center font-mono">
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                                    <span class="text-[9px] text-slate-500 block font-sans uppercase font-bold">Matches</span>
                                    <span class="text-xs font-bold text-white">${totalPlayed}</span>
                                </div>
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                                    <span class="text-[9px] text-slate-500 block font-sans uppercase font-bold">Wins</span>
                                    <span class="text-xs font-bold text-amber-400">${wins}</span>
                                </div>
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                                    <span class="text-[9px] text-slate-500 block font-sans uppercase font-bold">Win Rate</span>
                                    <span class="text-xs font-bold text-emerald-400">${winRate}%</span>
                                </div>
                            </div>
                        </div>
                        <div class="pt-3 border-t border-slate-800 space-y-1.5 text-xs font-mono">
                            <div class="flex justify-between text-slate-400">
                                <span>Career Net Cash:</span>
                                <strong class="${totalScore >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${totalScore.toLocaleString()}</strong>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>Highest Match Score:</span>
                                <strong class="text-amber-400">$${bestScore.toLocaleString()}</strong>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        playerSearchInput.addEventListener('input', renderPlayers);
        loadDirectoryData();
    </script>
</body>
</html>
