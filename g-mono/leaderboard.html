<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Auto Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style> body { font-family: 'Google Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="g-mono.html" class="flex items-center gap-2 text-slate-300 hover:text-white text-sm font-medium">
                <span class="material-icons text-base">arrow_back</span> Monopoly Suite
            </a>
            <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
                <span class="material-icons text-sm">emoji_events</span> Standings
            </span>
        </div>
    </nav>
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-700/60 pb-6">
                <div>
                    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                        🏆 Official Leaderboards
                    </h1>
                    <p class="text-xs text-slate-400 mt-0.5">Automated standings. Exclusively calculates Ranked matches (>2 registered members).</p>
                </div>
                <!-- Timeframe Selector -->
                <div class="flex rounded-xl bg-slate-900/80 p-1 border border-slate-700/60" id="timeframeNav">
                    <button data-tf="month" class="tf-btn px-4 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition">Monthly</button>
                    <button data-tf="year" class="tf-btn px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition">Yearly</button>
                    <button data-tf="lifetime" class="tf-btn px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition">Lifetime</button>
                </div>
            </div>
            <div id="filterBar" class="flex flex-wrap gap-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700/50">
                <div id="monthGroup">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Month</label>
                    <select id="monthSelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                        <option value="08">August</option>
                        <option value="07">July</option>
                        <option value="06">June</option>
                        <option value="05">May</option>
                    </select>
                </div>
                <div id="yearGroup">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Year</label>
                    <select id="yearSelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
                <div class="flex items-end text-xs text-amber-400 font-mono">
                    <span>* Guest players & unranked matches (≤2 members) excluded</span>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr id="tableHeaders" class="text-slate-400 border-b border-slate-700 text-xs uppercase tracking-wider">
                            <!-- Dynamic Headers Injected via JS -->
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody" class="divide-y divide-slate-700/50 text-xs">
                        <tr>
                            <td colspan="8" class="py-8 text-center text-slate-400">Loading leaderboard rankings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script type="module">
        import { db, collection, getDocs } from "../web-info/firebase.js";
        let activeTimeframe = "month";
        const tfButtons = document.querySelectorAll('.tf-btn');
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const filterBar = document.getElementById('filterBar');
        const monthGroup = document.getElementById('monthGroup');
        const leaderboardBody = document.getElementById('leaderboardBody');
        const tableHeaders = document.getElementById('tableHeaders');

        tfButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                tfButtons.forEach(b => {
                    b.className = "tf-btn px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition";
                });
                e.target.className = "tf-btn px-4 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition";
                activeTimeframe = e.target.dataset.tf;
                if (activeTimeframe === 'lifetime') {
                    filterBar.style.display = 'none';
                } else {
                    filterBar.style.display = 'flex';
                    monthGroup.style.display = activeTimeframe === 'year' ? 'none' : 'block';
                }
                calculateAndRender();
            });
        });

        function showProperties() {
            if (activeTimeframe === 'lifetime' || activeTimeframe === 'year') return true;
            // If monthly, check if selected year is 2026 and month is NOT May (05), June (06), or July (07)
            if (activeTimeframe === 'month') {
                const yr = yearSelect.value;
                const mo = monthSelect.value;
                if (yr === '2026' && (mo === '05' || mo === '06' || mo === '07')) {
                    return false;
                }
                return true;
            }
            return false;
        }

        async function calculateAndRender() {
            const displayProps = showProperties();
            
            // Set dynamic table headers
            tableHeaders.innerHTML = `
                <th class="py-3 px-3">Rank</th>
                <th class="py-3 px-3">Player Member</th>
                <th class="py-3 px-3 text-center">Matches</th>
                <th class="py-3 px-3 text-center">Wins</th>
                ${displayProps ? `
                    <th class="py-3 px-3 text-center">Cities</th>
                    <th class="py-3 px-3 text-center">Stations/Util</th>
                    <th class="py-3 px-3 text-center">Total Props</th>
                ` : ''}
                <th class="py-3 px-3 text-right">Net Cash ($)</th>
            `;

            const colSpanCount = displayProps ? 8 : 5;
            leaderboardBody.innerHTML = `<tr><td colspan="${colSpanCount}" class="py-8 text-center text-slate-400">Computing leaderboard...</td></tr>`;

            try {
                const matchesRef = collection(db, "games", "Monopoly", "matches");
                const snapshot = await getDocs(matchesRef);
                const stats = {};

                snapshot.forEach(docSnap => {
                    const game = docSnap.data();
                    const players = game.players || [];
                    const memberCount = players.filter(p => p.isMember !== false && !p.isGuest).length;
                    if (memberCount <= 2) return;

                    const dateStr = game.date || docSnap.id;
                    let year = "", month = "";
                    if (dateStr.includes('-')) {
                        const parts = dateStr.split('-');
                        if (parts[0].length === 4) {
                            year = parts[0]; month = parts[1];
                        } else if (parts[2]?.length === 4) {
                            year = parts[2]; month = parts[1];
                        }
                    }

                    if (activeTimeframe === 'month' && (year !== yearSelect.value || month !== monthSelect.value)) return;
                    if (activeTimeframe === 'year' && year !== yearSelect.value) return;

                    players.forEach(p => {
                        if (p.isGuest || p.isMember === false) return;
                        const pName = p.name || "Member";
                        if (!stats[pName]) {
                            stats[pName] = { name: pName, matches: 0, wins: 0, cash: 0, cities: 0, stations: 0 };
                        }
                        stats[pName].matches += 1;
                        stats[pName].cash += Number(p.earnings || p.cash || 0);
                        if (p.isWinner) stats[pName].wins += 1;
                        stats[pName].cities += Number(p.cities || 0);
                        stats[pName].stations += Number(p.stations || 0);
                    });
                });

                const sorted = Object.values(stats).sort((a, b) => b.cash - a.cash);
                if (sorted.length === 0) {
                    leaderboardBody.innerHTML = `<tr><td colspan="${colSpanCount}" class="py-8 text-center text-slate-400">No valid ranked match records (>2 members) found for this timeframe.</td></tr>`;
                    return;
                }

                leaderboardBody.innerHTML = sorted.map((p, idx) => {
                    const totalProps = p.cities + p.stations;
                    return `
                        <tr class="hover:bg-slate-800/40 border-b border-slate-700/40">
                            <td class="py-3 px-3 font-bold ${idx === 0 ? 'text-amber-400 text-base' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-amber-600' : 'text-slate-500'}">
                                ${idx === 0 ? '🥇 #1' : idx === 1 ? '🥈 #2' : idx === 2 ? '🥉 #3' : `#${idx + 1}`}
                            </td>
                            <td class="py-3 px-3 font-semibold text-white">
                                <a href="view.html?player=${encodeURIComponent(p.name)}" class="hover:underline text-amber-400 flex items-center gap-1">
                                    <span>${p.name}</span>
                                    <span class="material-icons text-xs">open_in_new</span>
                                </a>
                            </td>
                            <td class="py-3 px-3 text-center text-slate-300 font-mono">${p.matches}</td>
                            <td class="py-3 px-3 text-center text-emerald-400 font-bold font-mono">${p.wins}</td>
                            ${displayProps ? `
                                <td class="py-3 px-3 text-center text-slate-300 font-mono">${p.cities}</td>
                                <td class="py-3 px-3 text-center text-slate-300 font-mono">${p.stations}</td>
                                <td class="py-3 px-3 text-center text-amber-400 font-bold font-mono">${totalProps}</td>
                            ` : ''}
                            <td class="py-3 px-3 text-right font-mono font-bold ${p.cash >= 0 ? 'text-emerald-400' : 'text-red-400'}">
                                $${p.cash.toLocaleString()}
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                leaderboardBody.innerHTML = `<tr><td colspan="${colSpanCount}" class="py-8 text-center text-red-400">Failed to calculate leaderboard data.</td></tr>`;
            }
        }

        monthSelect.addEventListener('change', calculateAndRender);
        yearSelect.addEventListener('change', calculateAndRender);
        calculateAndRender();
    </script>
</body>
</html>
