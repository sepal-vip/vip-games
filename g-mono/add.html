<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Gamers - Add Match Record</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: 'Google Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 flex flex-col items-center">

  <div class="max-w-2xl w-full space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <a href="/vip-games/" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition flex items-center">
        <span class="material-icons">arrow_back</span>
      </a>
      <h1 class="text-xl font-bold text-white tracking-wide">Add Match Result</h1>
      <div class="w-10"></div>
    </div>

    <!-- Match Entry Card (Captured for Share) -->
    <div id="matchCard" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center">
            <span class="material-icons">casino</span>
          </div>
          <div>
            <h2 class="text-base font-bold text-white">Monopoly Match</h2>
            <p id="cardDate" class="text-xs text-slate-400"></p>
          </div>
        </div>
        <span class="px-3 py-1 bg-amber-500/10 text-amber-400 text-xs font-bold rounded-full border border-amber-500/20">Active Scoreboard</span>
      </div>

      <!-- Player Score List -->
      <div id="playerList" class="space-y-3">
        <!-- Player Row 1 -->
        <div class="player-row bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3 transition">
          <div class="winner-badge hidden text-amber-400 flex items-center">
            <span class="material-icons text-xl">emoji_events</span>
          </div>
          <input type="text" placeholder="Player Name" class="player-name bg-transparent border-0 font-semibold text-white placeholder-slate-500 focus:outline-none flex-1 text-sm" value="Player 1">
          <div class="flex items-center gap-2">
            <input type="number" placeholder="Score" class="player-score bg-slate-900 border border-slate-700 text-white text-right px-3 py-2 rounded-xl w-24 text-sm font-bold focus:border-amber-500 focus:outline-none" value="0">
            <span class="text-xs text-slate-500 font-bold">PTS</span>
          </div>
        </div>

        <!-- Player Row 2 -->
        <div class="player-row bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3 transition">
          <div class="winner-badge hidden text-amber-400 flex items-center">
            <span class="material-icons text-xl">emoji_events</span>
          </div>
          <input type="text" placeholder="Player Name" class="player-name bg-transparent border-0 font-semibold text-white placeholder-slate-500 focus:outline-none flex-1 text-sm" value="Player 2">
          <div class="flex items-center gap-2">
            <input type="number" placeholder="Score" class="player-score bg-slate-900 border border-slate-700 text-white text-right px-3 py-2 rounded-xl w-24 text-sm font-bold focus:border-amber-500 focus:outline-none" value="0">
            <span class="text-xs text-slate-500 font-bold">PTS</span>
          </div>
        </div>
      </div>

      <button id="addPlayerBtn" type="button" class="w-full py-3 bg-slate-950/40 border border-dashed border-slate-800 hover:border-slate-600 rounded-2xl text-xs font-bold text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-2">
        <span class="material-icons text-sm">add</span> Add Another Player
      </button>
    </div>

    <!-- Actions & Sharing -->
    <div class="space-y-3">
      <button id="saveMatchBtn" type="button" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-2xl transition-all shadow-lg hover:shadow-amber-500/20 flex items-center justify-center gap-2">
        <span class="material-icons">save</span> Save Match Record
      </button>

      <div class="grid grid-cols-2 gap-3">
        <button id="shareScoreBtn" type="button" class="p-3.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold text-slate-200 transition flex items-center justify-center gap-2">
          <span class="material-icons text-base text-amber-500">share</span> Share Card & Link
        </button>
        <button id="copyLinkBtn" type="button" class="p-3.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold text-slate-200 transition flex items-center justify-center gap-2">
          <span class="material-icons text-base text-slate-400">content_copy</span> Copy Link
        </button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('cardDate').textContent = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

    // Dynamic Auto-Winner Selector
    function updateWinner() {
      const rows = document.querySelectorAll('.player-row');
      let highestScore = -Infinity;
      let winningRows = [];

      rows.forEach(row => {
        const score = parseFloat(row.querySelector('.player-score').value) || 0;
        if (score > highestScore && score > 0) {
          highestScore = score;
          winningRows = [row];
        } else if (score === highestScore && score > 0) {
          winningRows.push(row);
        }
      });

      rows.forEach(row => {
        const badge = row.querySelector('.winner-badge');
        if (winningRows.includes(row)) {
          badge.classList.remove('hidden');
          row.classList.add('border-amber-500/50', 'bg-amber-500/5');
        } else {
          badge.classList.add('hidden');
          row.classList.remove('border-amber-500/50', 'bg-amber-500/5');
        }
      });
    }

    function attachListeners() {
      document.querySelectorAll('.player-score').forEach(input => {
        input.removeEventListener('input', updateWinner);
        input.addEventListener('input', updateWinner);
      });
    }

    attachListeners();

    // Add Player Row
    document.getElementById('addPlayerBtn').addEventListener('click', () => {
      const playerList = document.getElementById('playerList');
      const count = playerList.querySelectorAll('.player-row').length + 1;
      const newRow = document.createElement('div');
      newRow.className = 'player-row bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3 transition';
      newRow.innerHTML = `
        <div class="winner-badge hidden text-amber-400 flex items-center">
          <span class="material-icons text-xl">emoji_events</span>
        </div>
        <input type="text" placeholder="Player Name" class="player-name bg-transparent border-0 font-semibold text-white placeholder-slate-500 focus:outline-none flex-1 text-sm" value="Player ${count}">
        <div class="flex items-center gap-2">
          <input type="number" placeholder="Score" class="player-score bg-slate-900 border border-slate-700 text-white text-right px-3 py-2 rounded-xl w-24 text-sm font-bold focus:border-amber-500 focus:outline-none" value="0">
          <span class="text-xs text-slate-500 font-bold">PTS</span>
        </div>
      `;
      playerList.appendChild(newRow);
      attachListeners();
    });

    // Score Card Screenshot & WhatsApp / Native Share
    document.getElementById('shareScoreBtn').addEventListener('click', async () => {
      const target = document.getElementById('matchCard');
      const matchUrl = window.location.href;
      const shareMessage = `🎮 VIP Gamers Monopoly Results:\nCheck Match Record: ${matchUrl}`;

      try {
        const canvas = await html2canvas(target, {
          backgroundColor: '#020617',
          scale: 2,
          windowWidth: target.scrollWidth + 40
        });

        canvas.toBlob(async (blob) => {
          const imageFile = new File([blob], 'vip-gamers-score.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [imageFile] })) {
            await navigator.share({
              files: [imageFile],
              title: 'VIP Gamers Match',
              text: shareMessage
            });
          } else if (navigator.share) {
            await navigator.share({
              title: 'VIP Gamers Match',
              text: shareMessage,
              url: matchUrl
            });
          } else {
            const waLink = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessage)}`;
            window.open(waLink, '_blank');
          }
        }, 'image/png');
      } catch (err) {
        console.error('Share failure:', err);
      }
    });

    document.getElementById('copyLinkBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      alert('Link copied to clipboard!');
    });
  </script>
</body>
</html>
