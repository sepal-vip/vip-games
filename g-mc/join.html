<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joining Minecraft Server...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://sepal-vip.github.io/vip-games/monoploy-icon.png">
    <link rel="stylesheet" href="../web-info/global-style.css">
    <script src="../web-info/theme.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 selection:bg-emerald-500 selection:text-slate-950">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="glass-panel max-w-sm w-full p-6 rounded-3xl shadow-2xl border border-emerald-500/30 text-center space-y-4 relative z-10">
        <div class="w-16 h-16 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 flex items-center justify-center mx-auto shadow-inner">
            <span class="material-icons text-3xl">sports_esports</span>
        </div>

        <div>
            <h1 class="text-xl font-black text-white">Connecting to Minecraft</h1>
            <p id="subStatus" class="text-xs text-slate-400 mt-1">Fetching live server parameters...</p>
        </div>

        <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800 text-xs font-mono space-y-1">
            <div class="text-slate-500 text-[10px] uppercase">Destination Server</div>
            <div id="displayServerName" class="text-emerald-400 font-bold">Fetching...</div>
            <div id="displayHostPort" class="text-slate-300 text-[11px]">----:-----</div>
            <div id="displayProfile" class="text-[10px] text-sky-400 font-bold uppercase pt-1">Detecting Engine...</div>
        </div>

        <div class="pt-2 space-y-2">
            <a id="btnDirectProtocol" href="#" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                <span class="material-icons text-sm">open_in_new</span> Launch Minecraft Client
            </a>
            <button id="btnCopyAddress" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 font-bold rounded-xl text-xs transition border border-slate-800 flex items-center justify-center gap-1">
                <span class="material-icons text-xs">content_copy</span> Copy Server IP
            </button>
            <a href="index.html" class="block text-xs text-slate-400 hover:text-white transition py-1">
                Back to Server Dashboard
            </a>
        </div>
    </div>

    <script type="module">
        import { db, doc, getDoc } from "../web-info/firebase.js";

        async function triggerJoin() {
            try {
                const cfgRef = doc(db, "games", "Minecraft", "config", "server");
                const stateRef = doc(db, "games", "Minecraft", "data", "state");

                const [cfgSnap, stateSnap] = await Promise.all([getDoc(cfgRef), getDoc(stateRef)]);

                const cfg = cfgSnap.exists() ? cfgSnap.data() : {};
                const state = stateSnap.exists() ? stateSnap.data() : {};
                const activeType = state.status?.activeType || "bedrock";

                const serverName = cfg.serverName || "VIP Minecraft Server";
                const host = cfg.host || "127.0.0.1";
                const port = cfg.port || 19132;

                document.getElementById('displayServerName').textContent = serverName;
                document.getElementById('displayHostPort').textContent = `${host}:${port}`;
                document.getElementById('displayProfile').textContent = `Engine: ${activeType.toUpperCase()}`;
                document.getElementById('subStatus').textContent = "Adding server link...";

                // Bedrock Protocol Handler
                const bedrockUrl = `minecraft://?addExternalServer=${encodeURIComponent(serverName)}|${host}:${port}`;
                const btnDirect = document.getElementById('btnDirectProtocol');
                btnDirect.href = bedrockUrl;

                document.getElementById('btnCopyAddress').onclick = () => {
                    navigator.clipboard.writeText(`${host}:${port}`);
                    alert(`Copied: ${host}:${port}`);
                };

                // Auto launch Bedrock if bedrock or bedcross flavor
                if (activeType === "bedrock" || activeType === "bedcross") {
                    setTimeout(() => {
                        window.location.href = bedrockUrl;
                    }, 600);
                } else {
                    document.getElementById('subStatus').textContent = "Pure Java Server active. Copy IP into Java multiplayer list.";
                }
            } catch (err) {
                document.getElementById('subStatus').textContent = "Connection lookup failed: " + err.message;
            }
        }

        triggerJoin();
    </script>
</body>
</html>
