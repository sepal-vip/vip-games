<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Server - Playit Tunnel Status</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      background-color: #090d13;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #21262d;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 1.3rem;
      color: #58a6ff;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }
    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b949e;
      margin-bottom: 6px;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8b949e;
    }
    .dot.online {
      background: #238636;
      box-shadow: 0 0 10px rgba(35, 134, 54, 0.7);
    }
    .dot.offline {
      background: #da3633;
      box-shadow: 0 0 10px rgba(218, 54, 51, 0.7);
    }
    .info-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
      font-size: 0.9rem;
    }
    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .info-label {
      color: #8b949e;
    }
    .info-val {
      font-family: Consolas, monospace;
      font-weight: 600;
      color: #f0f6fc;
    }
    .connect-banner {
      background: #04070b;
      border: 1px dashed #30363d;
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .connect-text {
      font-family: Consolas, monospace;
      font-size: 0.95rem;
      color: #79c0ff;
      word-break: break-all;
    }
    .copy-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .copy-btn:hover {
      background: #30363d;
      color: #ffffff;
    }
  </style>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Replace with your Firebase Project Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const playitStatus = document.getElementById("playit-status");
    const playitDot = document.getElementById("playit-dot");
    const serverStatus = document.getElementById("server-status");
    const serverDot = document.getElementById("server-dot");
    const heartbeatEl = document.getElementById("last-heartbeat");
    const activeWorldEl = document.getElementById("active-world");
    const copyBtn = document.getElementById("copy-btn");
    const serverAddress = document.getElementById("server-address");

    // Realtime listener for server and tunnel status from state document
    onSnapshot(doc(db, "games", "Minecraft", "data", "state"), (snap) => {
      const data = snap.data();
      const status = data?.status || {};

      // Playit tunnel status
      if (status.playitOnline) {
        playitDot.className = "dot online";
        playitStatus.innerText = "Tunnel Active";
      } else {
        playitDot.className = "dot offline";
        playitStatus.innerText = "Offline";
      }

      // Bedrock server status
      if (status.serverOnline) {
        serverDot.className = "dot online";
        serverStatus.innerText = "Running";
      } else {
        serverDot.className = "dot offline";
        serverStatus.innerText = "Stopped";
      }

      // Metadata
      activeWorldEl.innerText = data?.activeWorld || "Bedrock level";

      if (status.lastHeartbeat) {
        const d = new Date(status.lastHeartbeat);
        heartbeatEl.innerText = d.toLocaleTimeString();
      } else {
        heartbeatEl.innerText = "--:--:--";
      }
    });

    // Copy server connection string
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(serverAddress.innerText).then(() => {
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "Copied!";
        setTimeout(() => {
          copyBtn.innerText = originalText;
        }, 2000);
      });
    });
  </script>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Playit.gg Tunnel Gateway</h1>
        <div class="subtitle">VIP Bedrock Dedicated Server Monitor</div>
      </div>
    </header>

    <!-- Status Cards -->
    <div class="grid">
      <div class="card">
        <div class="card-label">Playit Tunnel</div>
        <div class="status-indicator">
          <div id="playit-dot" class="dot"></div>
          <span id="playit-status">Checking...</span>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Bedrock Process</div>
        <div class="status-indicator">
          <div id="server-dot" class="dot"></div>
          <span id="server-status">Checking...</span>
        </div>
      </div>
    </div>

    <!-- Details Table -->
    <div class="info-box">
      <div class="info-row">
        <span class="info-label">Active World</span>
        <span id="active-world" class="info-val">Loading...</span>
      </div>
      <div class="info-row">
        <span class="info-label">Last Agent Heartbeat</span>
        <span id="last-heartbeat" class="info-val">--:--:--</span>
      </div>
      <div class="info-row">
        <span class="info-label">Target Protocol</span>
        <span class="info-val">RakNet UDP / 19132</span>
      </div>
    </div>

    <!-- Direct Join Link Box -->
    <div class="connect-banner">
      <div>
        <div class="card-label" style="margin-bottom: 2px;">Public Playit Address</div>
        <!-- Enter your Playit assigned domain & port here -->
        <div id="server-address" class="connect-text">vip-bedrock.gl.at.ply.gg:19132</div>
      </div>
      <button id="copy-btn" class="copy-btn">Copy Address</button>
    </div>
  </div>
</body>
</html>
